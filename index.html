<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      iPad で使うための設定。
      user-scalable=no … 書いている最中に画面が拡大されないようにする
      viewport-fit=cover … ホームバーの部分まで画面を使う
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f3e9" />
    <!-- アイコン。これが無いとブラウザが /favicon.ico を探して404になる -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!-- iPad の「ホーム画面に追加」で使われるアイコン。PNG でないと表示されない -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- ホーム画面に追加したときの名前・色・アイコンをまとめた設定ファイル -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- ホーム画面に追加したときの見た目 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="かんじけんてい" />
    <title>漢検 6級・5級 れんしゅう</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      このアプリを使うには JavaScript が必要です。Safari の設定で JavaScript を有効にしてください。
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
